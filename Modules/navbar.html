<style>
:root {
    --primary: #0a4fa3;

}

body {
    margin: 0;
    font-family: "Inter", Arial, sans-serif;
}

.navbar {
    width: 100%;
    background: var(--primary);
    color: var(--text);
    z-index: 100;
    position: fixed;
    top: 0;
}

.nav-container {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;

}

.nav-logo {
    font-size: 1.6rem;
    font-weight: 700;
    margin-right: 1rem;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 18px;
    margin: 0;
    padding: 0;
    overflow-x: auto; /* permite scroll horizontal */
    flex-wrap: nowrap;
    scrollbar-width: none; /* Firefox */
}

.nav-links::-webkit-scrollbar {
    height: 6px;
}

.nav-links::-webkit-scrollbar-thumb {
    background: #ffffff50;

}

.nav-links li a {

}

.nav-links li a:hover {

}

.nav-toggle {
