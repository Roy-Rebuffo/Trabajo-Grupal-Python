<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="../styles/users.css">
</head>
<body>

    <div id="navbar"></div>

    <script>
      fetch("../../navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
    </script>
    
    <h1>Registro de usuarios</h1>
    <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre"><br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido"><br><br>

        <label for="email">Email:</label>
        <input type="text" id="email"><br><br>

        <label for="telefono">Telefono:</label>
        <input type="text" id="telefono"><br><br>

        <label for="ciudad">Ciudad:</label>
        <input type="text" id="ciudad"><br><br>

        <label for="fecha">Fecha de Contrato:</label>
        <input type="date" id="fecha"><br><br>

        <label for="rol">Rol:</label>
        <select id="rol">
            <option value="ADMINISTRADOR">Administrador</option>
            <option value="EMPLEADO">Empleado</option>
        </select><br><br>

        <button onclick="enviarUsuario()">Registrar Usuario</button>
    </div>

    <script src="../js/users.js"></script>
</body>
</html>
