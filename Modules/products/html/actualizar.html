<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Producto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/actualizar.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1 id="update-title">🔄 Actualizar Producto</h1>
            <p>Modifica la información de un producto existente en el inventario.</p>
        </header>

        <button class="action-btn btn-back" onclick="window.location.href='landing.html'">
            <span class="btn-icon">⬅️</span> Volver al Dashboard
        </button>

        <div class="form-card update-product-card">
            <h2>Buscar y Modificar</h2>
            <form id="update-product-form">
                <div class="form-group">
                    <label for="product-id">ID del Producto a Actualizar:</label>
                    <input type="text" id="product-id" name="product-id" placeholder="Ej:PR-0003" required>
                    <button type="button" onclick="SearchProduct()" class="form-btn search-btn">🔍 Buscar Producto</button>
                </div>
                
                <hr>

                <h3>Datos del Producto (Cargarán aquí después de la búsqueda)</h3>
                <div class="form-group">
                    <label for="product-stock">Nuevo Stock:</label>
                    <input type="number" id="product-stock" name="stock" value="0" min="0" required disabled>
                </div>
                <div class="form-group">
                    <label for="product-price">Nuevo Precio:</label>
                    <input type="number" id="product-price" name="price" value="0.00" min="0" step="0.01" required disabled>
                </div>

                <button type="button" onclick="UpdateProductData()" id="save-btn" class="form-btn submit-btn" disabled>💾 Guardar Cambios</button>
            </form>
        </div>
    </div>
</body>
<script src="../js/actualizar.js"></script>
</html>
