<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/añadir.css">
</head>

<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1 id="add-title">➕ Añadir Producto</h1>
            <p>Registra un nuevo producto en el sistema de inventario.</p>
        </header>

        <button class="action-btn btn-back" onclick="window.location.href='landing.html'">
            <span class="btn-icon">⬅️</span> Volver al Dashboard
        </button>

        <div class="form-card add-product-card">
            <h2>Datos del Nuevo Producto</h2>
            <form id="add-product-form">
                <div class="form-group">
                    <label for="new-name">Nombre del Producto:</label>
                    <input type="text" id="new-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="new-description">Descripción</label>
                    <input type="text" id="new-desc" name="desc" required>
                </div>
                <div class="form-group">
                    <label for="new-price">Precio:</label>
                    <input type="number" id="new-price" name="price" min="0.01" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="new-stock">Stock Inicial:</label>
                    <input type="number" id="new-stock" name="stock" min="1" value="1" required>
                </div>
                <button type="button" onclick="SentData()" class="btn-registrar-producto add-btn">
                    ✅ Registrar Producto
                </button>
            </form>
        </div>
    </div>
</body>
<script src="../js/products_add.js"></script>
</html>
