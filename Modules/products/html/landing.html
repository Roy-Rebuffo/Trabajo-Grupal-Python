<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> 
   <link rel="stylesheet" href="../../../style.css"> 
    <link rel="stylesheet" href="../styles/products.css">
    
</head>
<body>
     <div id="navbar"></div>

    <script>
      fetch("../../navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
    </script>
    <div class="dashboard-container main">
        <div class="dashboard-header">
            <h1 id="dashboard-title">Product Management Dashboard</h1>
            <p>Real-time overview of your product inventory</p>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon icon-blue">📦</div>
                <div class="kpi-label" id="total-products-label">Total Products</div>
                <div class="kpi-value" id="kpi-total-products">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon icon-teal">📊</div>
                <div class="kpi-label" id="total-stock-label">Total Stock</div>
                <div class="kpi-value" id="kpi-total-stock">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon icon-purple">💲</div>
                <div class="kpi-label" id="average-price-label">Average Price</div>
                <div class="kpi-value" id="kpi-avg-price">$0.00</div>
            </div>
        </div>

        <!-- <div class="charts-grid">
            <div class="chart-card">
                <h2 id="top-products-title">Top 5 Products by Stock</h2>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2 id="price-distribution-title">Price Distribution</h2>
                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div> -->

        <div class="table-card">
            <h2 id="latest-product-title">Latest Product Added</h2>
            <div class="product-details">
                <div class="detail-item">
                    <div class="detail-label">Product Name</div>
                    <div class="detail-value" id="latest-name">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Stock</div>
                    <div class="detail-value" id="latest-stock">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Price</div>
                    <div class="detail-value" id="latest-price">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Description</div>
                    <div class="detail-value" id="latest-description">-</div>
                </div>
            </div>
        </div>

        <div class="actions-card">
            <h2>Product Actions</h2>
            <div class="actions-grid">
                <button class="action-btn btn-list" id="btn-list" onclick="window.location.href='listar.html'"> <span class="btn-icon">📋</span> <span class="btn-text">Listar Productos</span> </button> 
                <button class="action-btn btn-update" id="btn-update" onclick="window.location.href='actualizar.html'"> <span class="btn-icon">🔄</span> <span class="btn-text">Actualizar Productos</span> </button> 
                <button class="action-btn btn-delete" id="btn-delete" onclick="window.location.href='borrar.html'"> <span class="btn-icon">🗑️</span> <span class="btn-text">Borrar Productos</span> </button> 
                <button class="action-btn btn-add" id="btn-add" onclick="window.location.href='añadir.html'"> <span class="btn-icon">➕</span> <span class="btn-text">Añadir Artículo</span> </button> 
                <button class="action-btn btn-details" id="btn-details" onclick="window.location.href='detalles.html'"> <span class="btn-icon">🔍</span> <span class="btn-text">Ver Detalles</span> </button> 
                <button class="action-btn btn-archive" id="btn-archive" onclick="window.location.href='archivar.html'"> <span class="btn-icon">📦</span> <span class="btn-text">Archivar Agotados</span> </button> 
                <button class="action-btn btn-discount" id="btn-discount" onclick="window.location.href='descuento.html'"> <span class="btn-icon">💳</span> <span class="btn-text">Aplicar Descuento</span> </button> 
                <button class="action-btn btn-export" id="btn-export" onclick="window.location.href='exportarDatos.html'"> <span class="btn-icon">📤</span> <span class="btn-text">Exportar Datos</span> </button> 
                <button class="action-btn btn-alerts" id="btn-alerts" onclick="window.location.href='alertas.html'"> <span class="btn-icon">🔔</span> <span class="btn-text">Alertas de Stock</span> </button> 
                <button class="action-btn btn-reorder" id="btn-reorder" onclick="window.location.href='reordenar.html'"> <span class="btn-icon">🔀</span> <span class="btn-text">Reordenar Inventario</span> </button>
            </div>
        </div>
    </div>
    <script src="../js/landing.js"></script>
    <script src="../js/styles.js"></script>
</body>
</html>
